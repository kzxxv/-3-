<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사문 x 경제 OX 개념 마스터</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --soc-color: #E67E22;
      --econ-color: #2ECC71;
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #2C3E50;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary-color);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      margin-bottom: 12px;
    }

    .btn:hover { opacity: 0.95; }
    .btn:active { transform: scale(0.98); }

    .btn-soc { background-color: var(--soc-color); }
    .btn-econ { background-color: var(--econ-color); }
    .btn-secondary { background-color: #95A5A6; }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .grid-btns .btn { margin-bottom: 0; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: bold;
      color: #7F8C8D;
    }

    .timer-bar-container {
      width: 100%;
      height: 8px;
      background-color: #ECF0F1;
      border-radius: 4px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      background-color: #E74C3C;
      width: 100%;
      transition: width 0.1s linear;
    }

    .question-box {
      min-height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F8F9FA;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 25px;
      word-break: keep-all;
    }

    .ox-btns {
      display: flex;
      gap: 15px;
    }

    .btn-o, .btn-x {
      flex: 1;
      height: 90px;
      font-size: 2.5rem;
      border-radius: 16px;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.1s;
    }

    .btn-o { background-color: #2ECC71; }
    .btn-x { background-color: #E74C3C; }

    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      color: white;
      padding: 30px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      z-index: 10;
    }

    .modal.active { display: flex; }

    .result-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .explanation {
      margin: 15px 0 20px 0;
      line-height: 1.6;
      font-size: 1rem;
      word-break: keep-all;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: left;
    }

    .option-btn.selected { border: 3px solid #2C3E50; }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-screen" class="screen active">
      <h1>📚 수능 개념 파괴자</h1>
      <p>사회·문화 & 경제 전단원 핵심 기출 선지<br>OX 퀴즈로 완전히 정복하자!</p>
      <button class="btn" onclick="goToScreen('subject-screen')">퀴즈 시작하기</button>
    </div>

    <div id="subject-screen" class="screen">
      <h1>과목 선택</h1>
      <p>도전할 과목을 선택하세요.</p>
      <button class="btn btn-soc" onclick="selectSubject('soc')">사회·문화 (전단원)</button>
      <button class="btn btn-econ" onclick="selectSubject('econ')">경 제 (전단원)</button>
    </div>

    <div id="setting-screen" class="screen">
      <h1 id="selected-subject-title">과목 설정</h1>
      
      <p style="margin-bottom: 8px; text-align: left; font-weight: bold;">1. 범위 선택</p>
      <button class="btn btn-secondary option-btn selected" id="mode-all" onclick="selectMode('all')">전범위 통합 모드</button>
      <div id="unit-select-container" style="display:none; margin-bottom: 15px;">
        <select id="unit-select" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size:0.95rem;"></select>
      </div>
      <button class="btn btn-secondary" onclick="toggleUnitSelect()">단원별 선택하기</button>

      <p style="margin-bottom: 8px; text-align: left; font-weight: bold; margin-top: 15px;">2. 제한 시간</p>
      <div class="grid-btns">
        <button class="btn btn-secondary option-btn" id="time-10" onclick="selectTime(10)">10초</button>
        <button class="btn btn-secondary option-btn selected" id="time-15" onclick="selectTime(15)">15초</button>
      </div>

      <button class="btn" style="margin-top: 15px;" onclick="startQuiz()">문제 풀기 시작</button>
    </div>

    <div id="quiz-screen" class="screen">
      <div class="quiz-header">
        <span id="quiz-category">사회·문화</span>
        <span id="quiz-progress">1 / 10</span>
      </div>
      <div class="timer-bar-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <div id="question-text" class="question-box">문제가 여기에 표시됩니다.</div>
      <div class="ox-btns">
        <button class="btn-o" onclick="submitAnswer('O')">O</button>
        <button class="btn-x" onclick="submitAnswer('X')">X</button>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <h1>퀴즈 완료!</h1>
      <p>수고하셨습니다.</p>
      <div style="font-size: 2.5rem; font-weight: bold; color: var(--primary-color); margin: 20px 0;">
        <span id="final-score">0</span> / <span id="total-count">0</span>
      </div>
      <button class="btn" onclick="goToScreen('subject-screen')">다시 도전하기</button>
      <button class="btn btn-secondary" onclick="goToScreen('start-screen')">처음으로</button>
    </div>

    <div id="feedback-modal" class="modal">
      <div id="modal-icon" class="result-icon">⭕</div>
      <h2 id="modal-title">정답입니다!</h2>
      <div id="modal-explanation" class="explanation">해설이 여기에 들어갑니다.</div>
      <button class="btn" onclick="nextQuestion()">다음 문제</button>
    </div>
  </div>

  <script>
    const quizDB = {
      soc: {
        title: "사회·문화",
        units: [
          "1단원: 사회·문화 현상의 탐구",
          "2단원: 개인과 사회 구조",
          "3단원: 문화와 사회",
          "4단원: 사회 계층과 불평등",
          "5단원: 현대 사회와 사회 변동"
        ],
        questions: [
          { unit: 0, q: "사회 실재론은 사회 문제를 해결하기 위해 제도 개선보다 개인의 의식 개혁을 강조한다.", a: "X", exp: "사회 실재론은 사회 구조 및 제도의 힘을 강조하므로 제도 개혁을 중시합니다. 개인 의식 개혁을 강조하는 것은 사회 개체론입니다." },
          { unit: 0, q: "자연 현상과 달리 사회·문화 현상은 개연성의 원리가 적용된다.", a: "O", exp: "자연 현상은 필연성과 확실성, 사회·문화 현상은 개연성과 확률성의 원리가 적용됩니다." },
          { unit: 0, q: "질적 연구 방법은 방법론적 일원론에 기초하여 법칙 발견을 목적으로 한다.", a: "X", exp: "방법론적 일원론과 법칙 발견을 목적으로 하는 것은 양적 연구 방법입니다. 질적 연구는 방법론적 이원론에 기초하여 깊이 있는 이해를 목적으로 합니다." },
          { unit: 0, q: "실험법은 양적 연구에서 주로 사용되며, 독립변인과 종속변인 간의 인과관계를 파악하기에 유리하다.", a: "O", exp: "실험법은 통제된 상황에서 변인 간 인과관계를 검증하는 양적 연구의 대표적 자료 수집 방법입니다." },
          { unit: 0, q: "자료 수집 방법 중 질문지법은 문맹자에게 적용하기 유리하다는 장점이 있다.", a: "X", exp: "질문지법은 글을 읽고 쓸 줄 알아야 하므로 문맹자에게 적용하기 어렵습니다. 면접법이나 참여관찰법이 문맹자에게 유리합니다." },
          { unit: 0, q: "참여 관찰법은 실제성 높은 생생한 자료를 수집할 수 있으나, 관찰자의 편견이나 주관이 개입될 가능성이 크다.", a: "O", exp: "참여관찰법은 현장감이 높지만 관찰자의 주관 개입 및 예상치 못한 상황 통제가 어렵다는 단점이 있습니다." },
          { unit: 0, q: "기능론은 사회 각 부분이 상호 의존적 관계를 맺으며 사회 전체의 안정과 질서 유지에 기여한다고 본다.", a: "O", exp: "기능론은 사회를 하나의 유기체로 보며, 각 부분이 고유한 기능을 수행하여 균형을 이룬다고 설명합니다." },
          { unit: 0, q: "갈등론은 사회 변동을 사회의 해체나 혼란으로 보며 가급적 피해야 할 부정적 현상으로 간주한다.", a: "X", exp: "갈등론은 모순과 갈등을 통해 사회가 발전한다고 보므로 사회 변동을 자연스럽고 긍정적인 것으로 봅니다. 변동을 부정적으로 보는 것은 기능론입니다." },
          { unit: 0, q: "상징적 상호 작용론은 사회 구조나 제도보다 개인 간의 상호 작용과 의미 부여 과정에 주목한다.", a: "O", exp: "상징적 상호 작용론은 미시적 관점으로, 사람들이 상징을 통해 주고받는 의미와 해석을 중시합니다." },

          { unit: 1, q: "자발적 결사체는 모두 비공식 조직에 해당한다.", a: "X", exp: "시민단체나 노동조합 같은 자발적 결사체는 공식 조직입니다. 비공식 조직은 공식 조직 내에 존재하는 자발적 결사체(동호회 등)에 한정됩니다." },
          { unit: 1, q: "귀속 지위는 개인의 노력이나 능력에 의해 후천적으로 획득되는 지위이다.", a: "X", exp: "개인의 노력으로 획득되는 것은 '성취 지위'입니다. 귀속 지위는 태어나면서 자연스럽게 갖게 되는 지위입니다." },
          { unit: 1, q: "역할 갈등은 한 인물이 동시에 서로 다른 역할을 요구받아 충돌할 때 발생한다.", a: "O", exp: "역할 갈등은 두 가지 이상의 역할이 상충할 때 발생하는 심리적 갈등을 의미합니다." },
          { unit: 1, q: "관료제 조직은 탈관료제 조직에 비해 과업의 표준화 및 신분 보장 정도가 높다.", a: "O", exp: "관료제는 서열화, 과업 표준화, 연공서열 및 신분 보장이 강화된 연계 구조를 가집니다." },
          { unit: 1, q: "1차 사회화 기관은 기초적인 인성 형성 및 예절 교육을 담당하며, 대표적으로 학교가 있다.", a: "X", exp: "학교는 전문적인 지식과 규범을 가르치는 2차 사회화 기관입니다. 1차 사회화 기관의 대표적 예는 가정입니다." },
          { unit: 1, q: "재사회화는 현대 사회처럼 급변하는 환경에 적응하기 위해 새로운 지식이나 규범을 배우는 과정이다.", a: "O", exp: "성인이 된 후 사회 변화나 새로운 환경에 맞추어 다시 교육받는 것을 재사회화라고 합니다." },
          { unit: 1, q: "아노미 이론 중 머튼(Merton)은 문화적 목표와 제도적 수단 간의 불일치를 아노미의 원인으로 보았다.", a: "O", exp: "머튼의 아노미 이론은 사회적으로 승인된 목표와 이를 달성할 수 있는 합법적 수단 사이의 격차에서 범죄와 일탈이 발생한다고 봅니다." },
          { unit: 1, q: "낙인 이론은 특정 행위 자체의 객관적 속성 때문에 일탈이 정해진다고 본다.", a: "X", exp: "낙인 이론은 행위 자체보다 그 행위에 대한 사회적 반응과 낙인 부여 과정을 중시합니다." },

          { unit: 2, q: "문화 상대주의는 타 문화를 평가할 때 절대적인 기준을 적용하는 태도이다.", a: "X", exp: "절대적 기준을 적용해 문화의 우열을 가리는 것은 문화 절대주의(자문화/타문화 중심주의)입니다. 상대주의는 해당 맥락에서 이해하려는 태도입니다." },
          { unit: 2, q: "문화 변동 중 문화 접변의 결과로 고유 문화와 외래 문화가 융합되어 제3의 문화가 나타나는 것을 문화 병존이라 한다.", a: "X", exp: "고유 문화와 외래 문화가 결합해 제3의 문화가 형성되는 것은 '문화 융합'입니다. 문화 병존은 두 문화가 독립성을 유지하며 함께 존재하는 것입니다." },
          { unit: 2, q: "반문화는 하위문화에 포함되며, 사회 변동을 촉진하는 계기가 되기도 한다.", a: "O", exp: "반문화는 특정 하위문화의 한 형태이며 기존 지배적 가치에 저항하여 사회 변동의 원동력이 될 수 있습니다." },
          { unit: 2, q: "문화 지체 현상은 비물질 문화의 변동 속도를 물질 문화가 따라가지 못해 발생한다.", a: "X", exp: "문화 지체는 물질 문화의 급격한 발전을 비물질 문화(제도, 의식 등)가 따라가지 못할 때 발생합니다." },
          { unit: 2, q: "자문화 중심주의는 타 문화의 수용을 어렵게 하여 문화적 정체성을 상실시킬 위험이 크다.", a: "X", exp: "자문화 중심주의는 자기 문화를 우월하게 여겨 국수주의로 흐를 수 있지만 주체성을 높여줍니다. 타 문화에 맹목적으로 빠져 정체성을 잃는 것은 '문화 사대주의'입니다." },
          { unit: 2, q: "문화의 축적성은 인간이 문화 선행 세대의 지식과 경험을 다음 세대에 전달하며 더욱 풍부해지는 속성이다.", a: "O", exp: "언어와 기호를 통해 문화가 세대를 거치며 쌓여가는 것을 축적성이라 합니다." },

          { unit: 3, q: "계급론(마르크스)은 사회 계층화 현상을 경제적 요인에 의해 단원론적으로 설명한다.", a: "O", exp: "마르크스의 계급론은 생산수단 소유 여부라는 경제적 단일 기준에 따라 사회를 이분법적으로 구분합니다." },
          { unit: 3, q: "베버의 다원론적 계층론에 따르면 클래스(계급), 지위 집단, 정당은 반드시 일치한다.", a: "X", exp: "베버는 경제, 사회, 정치 영역이 불일치할 수 있는 '지위 불일치 현상'을 설명하였습니다." },
          { unit: 3, q: "절대적 빈곤은 상위 소득 계층과의 상대적 비교를 통해 정의되는 개념이다.", a: "X", exp: "상위 계층과의 비교를 통해 정해지는 것은 '상대적 빈곤'입니다. 절대적 빈곤은 최저 생계비 미만의 상태를 의미합니다." },
          { unit: 3, q: "우리나라의 사회 보장 제도 중 사회 보험은 수혜 대상자의 비용 부담을 원칙으로 하지 않는다.", a: "X", exp: "국민건강보험 등 사회 보험은 수혜자(가입자)와 사업주, 국가가 비용을 분담하는 능동적 형평성 제도로, 본인 부담금이 존재합니다. 무상 제공은 공공부조입니다." },
          { unit: 3, q: "공공부조는 사후 처방적 성격이 강하며, 상호구조 원리에 기초한 사전 예방적 제도는 사회 보험이다.", a: "O", exp: "공공부조는 빈곤층을 지원하는 사후 구제 제도이고, 사회 보험은 위험을 미리 대비하는 사전 예방적 제도입니다." },
          { unit: 3, q: "세대 간 이동은 한 개인이 생애 동안 수행한 직업이나 계층의 변화를 의미한다.", a: "X", exp: "한 개인의 일생 동안 나타나는 이동은 '세대 내 이동'입니다. 부모 세대와 자녀 세대 간의 계층 변화는 '세대 간 이동'입니다." },

          { unit: 4, q: "진화론은 사회 변동이 반드시 발전과 향상을 의미한다고 보아 사회 퇴행이나 순환적 변화를 설명하기 어렵다는 한계가 있다.", a: "O", exp: "진화론은 모든 사회가 일직선상으로 발전한다고 보므로, 사회의 쇠퇴나 멸망, 순환적 과정을 설명하기 어렵습니다." },
          { unit: 4, q: "근대화론은 서구화가 곧 근대화라고 보며, 전통적인 가치와 제도를 근대화의 저해 요인으로 본다.", a: "O", exp: "근대화론은 서구 사회의 발전 모델을 보편적인 것으로 설정하고 전통 요소를 부정적으로 평가하는 경향이 있습니다." },

          { unit: 4, q: "정보 사회는 산업 사회에 비해 다품종 소량 생산 체제의 비중이 높다.", a: "O", exp: "산업 사회는 소품종 대량 생산, 정보 사회는 소비자의 다양한 욕구를 반영한 다품종 소량 생산이 주를 이룹니다." }

        ],
        questions: [
          { unit: 0, q: "매몰 비용은 이미 지출되어 회수할 수 없는 비용이므로, 합리적 선택을 할 때 반드시 고려해야 한다.", a: "X", exp: "매몰 비용은 회수할 수 없는 비용이므로 합리적 의사결정 시 반드시 고려 대상에서 '제외'해야 합니다." },

          { unit: 0, q: "자유재는 희소성이 없으나 경제재는 희소성이 존재하는 재화이다.", a: "O", exp: "자유재는 욕구에 비해 양이 많아 희소성이 없는 재화이고, 경제재는 희소성이 있어 대가를 지불해야 하는 재화입니다." },
          { unit: 0, q: "규범 경제학은 '무엇인가(Is)'에 대한 객관적 사실 분석을 다루는 학문 분야이다.", a: "X", exp: "객관적 사실을 다루는 것은 실증 경제학입니다. 규범 경제학은 '어떻게 되어야 하는가(Ought to be)'에 대한 가치 판단을 다룹니다." },
          { unit: 0, q: "자원 배분의 효율성은 최소 비용으로 최대 효과를 거두는 경제성의 원리를 따르는 것이다.", a: "O", exp: "효율적인 자원 배분은 한정된 자원으로 최대의 만족을 얻거나 최소한의 비용을 들이는 것을 뜻합니다." },
          { unit: 0, q: "생산 가능 곡선이 원점에 대해 오목한 형태를 띠는 것은 기회비용 체감의 법칙 때문이다.", a: "X", exp: "생산 가능 곡선이 원점에 대해 오목한 형태인 것은 한 재화의 생산을 늘릴수록 기회비용이 점차 증가(체증)하기 때문입니다." },

          { unit: 1, q: "대체재 관계에 있는 A재의 가격이 상승하면, B재의 수요 곡선은 오른쪽으로 이동한다.", a: "O", exp: "A재 가격 상승 → A재 수요량 감소 → 대체재 B재 수요 증가 → B재 수요 곡선 우측 이동합니다." },
          { unit: 1, q: "최고 가격제(가격 상한제)를 시행하면 시장에서 초과 공급 현상이 나타난다.", a: "X", exp: "최고 가격제는 균형 가격보다 낮은 수준에서 가격을 통제하므로 초과 수요(공급 부족) 현상이 발생합니다." },
          { unit: 1, q: "수요의 가격 탄력성이 완만할수록(탄력적일수록) 가격 변화율보다 수요량의 변화율이 크다.", a: "O", exp: "탄력적이라는 것은 가격 변화에 대해 수요량이 크게 반응(변화율이 더 큼)함을 뜻합니다." },
          { unit: 1, q: "생산자 후생은 생산자가 실제 받은 금액에서 최소한 받고자했던 금액을 뺀 차액이다.", a: "O", exp: "생산자 여유분(후생)은 시장 가격과 공급 곡선 사이의 면적으로 계산됩니다." },
          { unit: 1, q: "열등재는 소득이 증가할 때 수요가 증가하는 재화이다.", a: "X", exp: "소득이 증가할 때 수요가 늘어나는 것은 '정상재'입니다. 소득이 증가할 때 오히려 수요가 줄어드는 재화를 '열등재'라고 합니다." },
          { unit: 1, q: "공공재는 비배제성과 비경합성을 가져 시장 실패의 원인이 된다.", a: "O", exp: "공공재는 대가를 치르지 않아도 이용 가능(비배제성)하고 다수가 동시에 이용 가능(비경합성)하여 무임승차 문제가 발생합니다." },
          { unit: 1, q: "외부 불경제(음의 외부효과)가 존재할 경우 시장에 맡겨두면 사회적으로 바람직한 수준보다 과다 생산된다.", a: "O", exp: "타인에게 피해를 주면서 대가를 치르지 않는 외부 불경제가 발생하면 개인적 비용이 사회적 비용보다 작아 과다 생산됩니다." },

          { unit: 2, q: "실질 GDP는 생산량의 변화뿐만 아니라 물가 변동도 함께 반영하여 측정한다.", a: "X", exp: "물가 변동을 제외하고 순수한 생산량 변화만을 측정하는 것은 '실질 GDP'입니다. 명목 GDP가 물가 변동을 포함합니다." },
          { unit: 2, q: "인플레이션이 발생하면 채권자(돈을 빌려준 사람)에게 유리하고 채무자에게 불리하다.", a: "X", exp: "인플레이션 시 화폐 가치가 하락하므로 채권자가 손해를 보고, 채무자가 이익을 얻습니다." },
          { unit: 2, q: "확장적 재정 정책(정부 지출 확대, 감세)은 경기 침체기에 총수요를 증가시키기 위해 시행한다.", a: "O", exp: "경기 침체기에는 정부 지출을 늘리고 세금을 줄여 시장의 총수요를 늘리는 정책을 씁니다." },
          { unit: 2, q: "비교 우위론에 따르면 한 국가가 두 재화 모두 절대 우위에 있더라도 무역을 통해 양국 모두 이익을 얻을 수 있다.", a: "O", exp: "리카도의 비교우위론에 따르면 기회비용이 더 작은 재화에 특화하여 교역하면 양국 모두 이익을 얻습니다." },
          { unit: 2, q: "기준 금리를 인상하면 시중 통화량이 늘어나 물가가 상승하는 경향이 있다.", a: "X", exp: "기준 금리를 인상하면 대출이 줄고 저축이 늘어 시중 통화량이 감소하며, 물가가 안정(하락)됩니다." },
          { unit: 2, q: "국제 수지표에서 우리나라 기업이 해외로 수출하여 벌어들인 대금은 상품 수지 흑자 요인이다.", a: "O", exp: "상품 수출에 따른 대금 유입은 경상수지 내 '상품 수지'의 수입(흑자)으로 기록됩니다." },
          { unit: 2, q: "원/달러 환율이 상승(원화 가치 하락)하면 국내 수출 기업의 가격 경쟁력이 강화된다.", a: "O", exp: "환율이 오르면 달러 표시 제품 가격이 낮아져 해외 시장에서 우리 수출품의 가격 경쟁력이 높아집니다." },

          { unit: 3, q: "주식은 채권과 달리 회사에 대한 지분권을 나타내며, 원금 손실의 위험이 존재한다.", a: "O", exp: "주식은 배당과 시세차익을 기대할 수 있으나 원금 보장이 되지 않는 자기자본 증권입니다." },
          { unit: 3, q: "예금자 보호 제도를 통해 금융기관당 1인당 원금과 이자를 합하여 최고 5천만 원까지 보호받을 수 있다.", a: "O", exp: "예금자보호법에 의해 각 금융기관별로 1인당 최고 5,000만원까지 보호받을 수 있습니다." },
          { unit: 3, q: "금융 자산 중 수익성이 가장 높을 가능성이 있는 자산은 일반적으로 은행의 정기 예금이다.", a: "X", exp: "정기 예금은 안전성은 높지만 수익성은 낮습니다. 위험성이 높은 주식이나 펀드가 상대적으로 높은 수익성을 기대할 수 있습니다." },
          { unit: 3, q: "채권은 정부, 지방자치단체, 주식회사 등이 자금을 조달하기 위해 발행하는 채무 증서이다.", a: "O", exp: "채권은 이자 지급과 만기 시 원금 상환을 약속하고 발행하는 차용증서 성격의 금융 상품입니다." }
        ]
      }
    };

    let currentSubject = '';
    let currentMode = 'all';
    let timeLimit = 15;
    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timerInterval = null;

    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function selectSubject(subject) {
      currentSubject = subject;
      document.getElementById('selected-subject-title').innerText = quizDB[subject].title + " 설정";
      
      const selectEl = document.getElementById('unit-select');
      selectEl.innerHTML = '';
      quizDB[subject].units.forEach((u, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = u;
        selectEl.appendChild(opt);
      });

      goToScreen('setting-screen');
    }

    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('mode-all').classList.toggle('selected', mode === 'all');
      document.getElementById('unit-select-container').style.display = (mode === 'unit') ? 'block' : 'none';
    }

    function toggleUnitSelect() {
      selectMode('unit');
    }

    function selectTime(sec) {
      timeLimit = sec;
      document.getElementById('time-10').classList.toggle('selected', sec === 10);
      document.getElementById('time-15').classList.toggle('selected', sec === 15);
    }

    function startQuiz() {
      const allQs = quizDB[currentSubject].questions;
      if (currentMode === 'all') {
        activeQuestions = [...allQs];
      } else {
        const uIdx = parseInt(document.getElementById('unit-select').value);
        activeQuestions = allQs.filter(q => q.unit === uIdx);
      }

      if (activeQuestions.length === 0) {
        alert("해당 단원에 문제 데이터가 없습니다!");
        return;
      }

      activeQuestions.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      score = 0;
      goToScreen('quiz-screen');
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIndex >= activeQuestions.length) {
        endQuiz();
        return;
      }

      const q = activeQuestions[currentIndex];
      document.getElementById('quiz-category').innerText = quizDB[currentSubject].title;
      document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${activeQuestions.length}`;
      document.getElementById('question-text').innerText = q.q;

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      const timerBar = document.getElementById('timer-bar');
      timerBar.style.width = '100%';

      const intervalStep = 100;
      const totalSteps = (timeLimit * 1000) / intervalStep;
      let currentStep = 0;

      timerInterval = setInterval(() => {
        currentStep++;
        const percent = Math.max(0, 100 - (currentStep / totalSteps) * 100);
        timerBar.style.width = percent + '%';

        if (currentStep >= totalSteps) {
          clearInterval(timerInterval);
          submitAnswer(null);
        }
      }, intervalStep);
    }

    function submitAnswer(userAnswer) {
      clearInterval(timerInterval);
      const q = activeQuestions[currentIndex];
      const isCorrect = (userAnswer === q.a);

      const modal = document.getElementById('feedback-modal');
      const modalIcon = document.getElementById('modal-icon');
      const modalTitle = document.getElementById('modal-title');
      const modalExp = document.getElementById('modal-explanation');

      if (userAnswer === null) {
        modalIcon.innerText = "⏰";
        modalTitle.innerText = "시간 초과!";
        modalTitle.style.color = "#E67E22";
      } else if (isCorrect) {
        score++;
        modalIcon.innerText = "⭕";
        modalTitle.innerText = "정답입니다!";
        modalTitle.style.color = "#2ECC71";
      } else {
        modalIcon.innerText = "❌";
        modalTitle.innerText = "틀렸습니다!";
        modalTitle.style.color = "#E74C3C";
      }

      modalExp.innerHTML = `<strong>[정답: ${q.a}]</strong><br>${q.exp}`;
      modal.classList.add('active');
    }

    function nextQuestion() {
      document.getElementById('feedback-modal').classList.remove('active');
      currentIndex++;
      loadQuestion();
    }

    function endQuiz() {
      document.getElementById('final-score').innerText = score;
      document.getElementById('total-count').innerText = activeQuestions.length;
      goToScreen('result-screen');
    }
  </script>
