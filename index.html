<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사문 x 경제 OX 개념 파괴자</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --soc-color: #E67E22;
      --econ-color: #2ECC71;
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #2C3E50;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary-color);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      margin-bottom: 12px;
    }

    .btn:hover {
      opacity: 0.95;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-soc { background-color: var(--soc-color); }
    .btn-econ { background-color: var(--econ-color); }
    .btn-secondary { background-color: #95A5A6; }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .grid-btns .btn {
      margin-bottom: 0;
    }

    /* Quiz Screen Styles */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: bold;
      color: #7F8C8D;
    }

    .timer-bar-container {
      width: 100%;
      height: 8px;
      background-color: #ECF0F1;
      border-radius: 4px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      background-color: #E74C3C;
      width: 100%;
      transition: width 0.1s linear;
    }

    .question-box {
      min-height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F8F9FA;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 25px;
      word-break: keep-all;
    }

    .ox-btns {
      display: flex;
      gap: 15px;
    }

    .btn-o, .btn-x {
      flex: 1;
      height: 90px;
      font-size: 2.5rem;
      border-radius: 16px;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.1s;
    }

    .btn-o { background-color: #2ECC71; }
    .btn-x { background-color: #E74C3C; }

    /* Modal Styles */
    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 30px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      z-index: 10;
    }

    .modal.active {
      display: flex;
    }

    .result-icon {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .explanation {
      margin: 20px 0;
      line-height: 1.6;
      font-size: 1.05rem;
      word-break: keep-all;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
    }

    /* Selection Highlighting */
    .option-btn.selected {
      border: 3px solid #2C3E50;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="start-screen" class="screen active">
      <h1>📚 수능 개념 파괴자</h1>
      <p>사회·문화 & 경제 핵심 기출 선지<br>OX 퀴즈로 타파하자!</p>
      <button class="btn" onclick="goToScreen('subject-screen')">퀴즈 시작하기</button>
    </div>

    <div id="subject-screen" class="screen">
      <h1>과목 선택</h1>
      <p>도전할 과목을 선택하세요.</p>
      <button class="btn btn-soc" onclick="selectSubject('soc')">사회·문화</button>
      <button class="btn btn-econ" onclick="selectSubject('econ')">경 제</button>
    </div>

    <div id="setting-screen" class="screen">
      <h1 id="selected-subject-title">과목 설정</h1>
      
      <p style="margin-bottom: 10px; text-align: left; font-weight: bold;">1. 범위 선택</p>
      <button class="btn btn-secondary option-btn selected" id="mode-all" onclick="selectMode('all')">전범위 통합 모드</button>
      <div id="unit-select-container" style="display:none; margin-bottom: 15px;">
        <select id="unit-select" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc;">
          </select>
      </div>
      <button class="btn btn-secondary" onclick="toggleUnitSelect()">단원별 선택하기</button>

      <p style="margin-bottom: 10px; text-align: left; font-weight: bold; margin-top: 15px;">2. 제한 시간</p>
      <div class="grid-btns">
        <button class="btn btn-secondary option-btn" id="time-10" onclick="selectTime(10)">10초</button>
        <button class="btn btn-secondary option-btn selected" id="time-15" onclick="selectTime(15)">15초</button>
      </div>

      <button class="btn" style="margin-top: 15px;" onclick="startQuiz()">문제 풀기 시작</button>
    </div>

    <div id="quiz-screen" class="screen">
      <div class="quiz-header">
        <span id="quiz-category">사회·문화</span>
        <span id="quiz-progress">1 / 5</span>
      </div>
      <div class="timer-bar-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <div id="question-text" class="question-box">
        문제가 여기에 표시됩니다.
      </div>
      <div class="ox-btns">
        <button class="btn-o" onclick="submitAnswer('O')">O</button>
        <button class="btn-x" onclick="submitAnswer('X')">X</button>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <h1>퀴즈 완료!</h1>
      <p>수고하셨습니다.</p>
      <div style="font-size: 2.5rem; font-weight: bold; color: var(--primary-color); margin: 20px 0;">
        <span id="final-score">0</span> / <span id="total-count">0</span>
      </div>
      <button class="btn" onclick="goToScreen('subject-screen')">다시 도전하기</button>
      <button class="btn btn-secondary" onclick="goToScreen('start-screen')">처음으로</button>
    </div>

    <div id="feedback-modal" class="modal">
      <div id="modal-icon" class="result-icon">⭕</div>
      <h2 id="modal-title">정답입니다!</h2>
      <div id="modal-explanation" class="explanation">
        해설이 여기에 들어갑니다.
      </div>
      <button class="btn" onclick="nextQuestion()">다음 문제</button>
    </div>
  </div>

  <script>
    // 퀴즈 데이터베이스
    const quizDB = {
      soc: {
        title: "사회·문화",
        units: ["1단원: 사회·문화 현상의 탐구", "2단원: 개인과 사회 구조", "3단원: 문화와 사회"],
        questions: [
          { unit: 0, q: "사회 실재론은 사회 문제를 해결하기 위해 제도 개선보다 개인의 의식 개혁을 강조한다.", a: "X", exp: "사회 실재론은 사회 구조 및 제도의 힘을 강조하므로 제도 개혁을 중시합니다. 개인 의식 개혁을 강조하는 것은 사회 개체론입니다." },
          { unit: 0, q: "자연 현상과 달리 사회·문화 현상은 개연성의 원리가 적용된다.", a: "O", exp: "자연 현상은 필연성과 확실성, 사회·문화 현상은 개연성과 확률성의 원리가 적용됩니다." },
          { unit: 1, q: "자발적 결사체는 모두 비공식 조직에 해당한다.", a: "X", exp: "시민단체나 노동조합 같은 자발적 결사체는 공식 조직에 해당합니다. 비공식 조직은 공식 조직 내에 존재하는 자발적 결사체(동호회 등)에 한정됩니다." },
          { unit: 2, q: "문화 상대주의는 타 문화를 평가할 때 절대적인 기준을 적용하는 태도이다.", a: "X", exp: "절대적인 기준을 적용하여 타 문화를 평가하는 것은 문화 자대주의(자문화/타문화 중심주의)입니다. 문화 상대주의는 해당 사회의 맥락에서 이해하는 태도입니다." }
        ]
      },
      econ: {
        title: "경제",
        units: ["1단원: 경제생활과 선택", "2단원: 시장과 경제 활동", "3단원: 국가와 세계 경제"],
        questions: [
          { unit: 0, q: "매몰 비용은 이미 지출되어 회수할 수 없는 비용이므로, 합리적 선택을 할 때 반드시 고려해야 한다.", a: "X", exp: "매몰 비용은 회수 불가능한 비용이므로 합리적 의사결정 시 고려 대상에서 '제외'해야 합니다." },
          { unit: 1, q: "대체재 관계에 있는 A재의 가격이 상승하면, B재의 수요 곡선은 오른쪽으로 이동한다.", a: "O", exp: "A재 가격 상승 → A재 수요량 감소 → 대체재인 B재의 수요 증가로 B재 수요 곡선이 우측 이동합니다." },
          { unit: 1, q: "최고 가격제(가격 상한제)를 시행하면 시장에서 초과 공급 현상이 나타난다.", a: "X", exp: "최고 가격제는 균형 가격보다 낮은 수준에서 가격을 설정하므로 수요가 공급보다 많은 '초과 수요(공급 부족)'가 발생합니다." },
          { unit: 2, q: "인플레이션이 발생하면 채권자(돈을 빌려준 사람)에게 유리하고 채무자에게 불리하다.", a: "X", exp: "인플레이션 시 화폐 가치가 하락하므로 채권자가 손해를 보고, 채무자가 이익을 얻습니다." }
        ]
      }
    };

    // 상태 변수
    let currentSubject = '';
    let currentMode = 'all'; // 'all' 또는 'unit'
    let selectedUnitIndex = 0;
    let timeLimit = 15;
    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timerInterval = null;
    let timeLeft = 0;

    // 화면 전환
    function goToScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // 과목 선택
    function selectSubject(subject) {
      currentSubject = subject;
      document.getElementById('selected-subject-title').innerText = quizDB[subject].title + " 설정";
      
      // 단원 드롭다운 초기화
      const selectEl = document.getElementById('unit-select');
      selectEl.innerHTML = '';
      quizDB[subject].units.forEach((u, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = u;
        selectEl.appendChild(opt);
      });

      goToScreen('setting-screen');
    }

    // 모드/단원 선택
    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('mode-all').classList.toggle('selected', mode === 'all');
      document.getElementById('unit-select-container').style.display = (mode === 'unit') ? 'block' : 'none';
    }

    function toggleUnitSelect() {
      selectMode('unit');
    }

    // 시간 선택
    function selectTime(sec) {
      timeLimit = sec;
      document.getElementById('time-10').classList.toggle('selected', sec === 10);
      document.getElementById('time-15').classList.toggle('selected', sec === 15);
    }

    // 퀴즈 시작
    function startQuiz() {
      // 문제 필터링
      const allQs = quizDB[currentSubject].questions;
      if (currentMode === 'all') {
        activeQuestions = [...allQs];
      } else {
        const uIdx = parseInt(document.getElementById('unit-select').value);
        activeQuestions = allQs.filter(q => q.unit === uIdx);
      }

      if (activeQuestions.length === 0) {
        alert("해당 단원에 아직 등록된 문제가 없습니다!");
        return;
      }

      // 문제 섞기
      activeQuestions.sort(() => Math.random() - 0.5);
      
      currentIndex = 0;
      score = 0;
      goToScreen('quiz-screen');
      loadQuestion();
    }

    // 문제 로드
    function loadQuestion() {
      if (currentIndex >= activeQuestions.length) {
        endQuiz();
        return;
      }

      const q = activeQuestions[currentIndex];
      document.getElementById('quiz-category').innerText = quizDB[currentSubject].title;
      document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${activeQuestions.length}`;
      document.getElementById('question-text').innerText = q.q;

      startTimer();
    }

    // 타이머
    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = timeLimit;
      const timerBar = document.getElementById('timer-bar');
      timerBar.style.width = '100%';

      const intervalStep = 100; // 0.1초마다 업데이트
      const totalSteps = (timeLimit * 1000) / intervalStep;
      let currentStep = 0;

      timerInterval = setInterval(() => {
        currentStep++;
        const percent = Math.max(0, 100 - (currentStep / totalSteps) * 100);
        timerBar.style.width = percent + '%';

        if (currentStep >= totalSteps) {
          clearInterval(timerInterval);
          submitAnswer(null); // 시간 초과
        }
      }, intervalStep);
    }

    // 정답 제출
    function submitAnswer(userAnswer) {
      clearInterval(timerInterval);
      const q = activeQuestions[currentIndex];
      const isCorrect = (userAnswer === q.a);

      const modal = document.getElementById('feedback-modal');
      const modalIcon = document.getElementById('modal-icon');
      const modalTitle = document.getElementById('modal-title');
      const modalExp = document.getElementById('modal-explanation');

      if (userAnswer === null) {
        modalIcon.innerText = "⏰";
        modalTitle.innerText = "시간 초과!";
        modalTitle.style.color = "#E67E22";
      } else if (isCorrect) {
        score++;
        modalIcon.innerText = "⭕";
        modalTitle.innerText = "정답입니다!";
        modalTitle.style.color = "#2ECC71";
      } else {
        modalIcon.innerText = "❌";
        modalTitle.innerText = "틀렸습니다!";
        modalTitle.style.color = "#E74C3C";
      }

      modalExp.innerHTML = `<strong>[정답: ${q.a}]</strong><br>${q.exp}`;
      modal.classList.add('active');
    }

    // 다음 문제
    function nextQuestion() {
      document.getElementById('feedback-modal').classList.remove('active');
      currentIndex++;
      loadQuestion();
    }

    // 퀴즈 종료
    function endQuiz() {
      document.getElementById('final-score').innerText = score;
      document.getElementById('total-count').innerText = activeQuestions.length;
      goToScreen('result-screen');
    }
  </script>
</body>
</html>
